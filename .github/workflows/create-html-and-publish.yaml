name: create-html-and-publish
on: [push]

jobs:
   create-html:
      runs-on: ubuntu-latest
      steps:
        - name: checkout code
          uses: actions/checkout@v2

        - name: convert to html
          run: |
             sudo apt-get install asciidoctor
             asciidoctor -R . -D . '**/*.adoc'

	- name: set up ssh key
	  run: |
             echo '${{ secrets.DAVIDBARNHART_COM_SSH_PUBLIC }}' > ssh_key
             chmod 600 ssh_key
             
	- name: upload to davidbarnhart.com
          run: |
             scp index.html david@davidbarnhart.com:~/
       

